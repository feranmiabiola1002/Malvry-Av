services:
  - type: web
    name: malvryx-av
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "import sys; sys.path.insert(0, '.'); from src.database import init_default_signatures; init_default_signatures()"
    startCommand: python -m src.web_server
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: RENDER
        value: true
    plan: free
    autoDeploy: true
    healthCheckPath: /
